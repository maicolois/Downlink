name: Downlink

options:
  bundleIdPrefix: app.downlink
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  PythonKit:
    url: https://github.com/pvieito/PythonKit.git
    revision: d030b5193d1e4e770156deb27865773b64c5695f
  SwiftFFmpeg:
    path: Vendor/SwiftFFmpeg-iOS

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_TESTABILITY: YES
    HEADER_SEARCH_PATHS: "$(inherited) $(BUILT_PRODUCTS_DIR)/Python.framework/Headers"
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
    OTHER_LDFLAGS: "$(inherited) -ObjC -all_load"

targets:
  Downlink:
    type: application
    platform: iOS
    sources:
      - path: Downlink
        excludes:
          - Python
      - path: Downlink/Python
        type: folder
        buildPhase: resources
      - path: python-packages
        type: folder
        buildPhase: resources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: PythonKit
      - package: SwiftFFmpeg
      - framework: Vendor/Python.xcframework
        embed: true
      - sdk: Security.framework
      - sdk: WebKit.framework
      - sdk: UniformTypeIdentifiers.framework
    info:
      path: Config/Info.plist
    entitlements:
      path: Config/Downlink.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.downlink.ios
        PRODUCT_NAME: DOWNLINK
        PRODUCT_MODULE_NAME: Downlink
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
    postBuildScripts:
      - name: Install bundled Python runtime
        path: Scripts/install-python-runtime.sh
        basedOnDependencyAnalysis: false

  DownlinkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DownlinkTests
    dependencies:
      - target: Downlink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.downlink.ios.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Downlink:
    build:
      targets:
        Downlink: all
        DownlinkTests: [test]
    test:
      targets:
        - DownlinkTests
